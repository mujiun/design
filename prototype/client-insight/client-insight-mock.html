<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Manager — Partner overview (wireframe)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300..800&display=block" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFFFF; --page-bg: #F0F2F5; --surface: #F5F6F7;
      --ink: #1C2B33; --ink2: #465A69; --ink3: #6B7A85;
      --accent: #0A78BE; --accent-light: #E7F0FD;
      --border: #E4E6EB; --border-light: #ECEEF0;
      --title: 'Commissioner', -apple-system, BlinkMacSystemFont, sans-serif;
      /* wireframe tokens */
      --card: #FFFFFF; --card-border: #EEF0F2;
      --label: #9BA6AE; --fill: #E3E7EA; --fill-soft: #EAEDEF;
    }
    html, body {
      min-height: 100%; font-family: var(--title);
      background: var(--page-bg); background-image: url('../shared/bg.jpg');
      background-size: cover; background-attachment: fixed; color: var(--ink);
      -webkit-font-smoothing: antialiased; font-size: 13px; line-height: 1.5; letter-spacing: 0.1px;
    }

    /* ══ LEFT SYSTEM ICON RAIL ══ */
    .sys-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 16px 0 14px; gap: 6px; z-index: 90; }
    .sys-logo { margin-bottom: 8px; }
    .sys-logo img { width: 32px; height: 32px; object-fit: contain; display: block; }
    .sys-biz { position: relative; width: 36px; height: 36px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .sys-biz svg { width: 24px; height: 24px; display: block; }
    .sys-biz span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: translateY(-1px); color: #fff; font-weight: 600; font-size: 11px; }
    .sys-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink2); transition: background 0.12s; }
    .sys-icon:hover { background: var(--surface); }
    .sys-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .sys-spacer { flex: 1; }

    /* ══ SHELL ══ */
    .wrap { margin-left: 64px; padding: 22px 28px 40px; }
    .topbar { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 18px; padding-left: 4px; }
    .topbar .crumb-sep { display: inline-flex; align-items: center; }
    .topbar .crumb-sep svg { width: 20px; height: 20px; stroke: var(--ink2); fill: none; stroke-width: 1.8; }
    .body-row { display: flex; gap: 20px; align-items: flex-start; }

    /* ══ NAV ══ */
    .wa-nav { width: 240px; flex-shrink: 0; padding-top: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 6px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: none; user-select: none; transition: background 0.1s; white-space: nowrap; }
    .nav-item:hover { background: rgba(0,0,0,0.06); }
    .nav-item.active { background: #1C2B33; color: #fff; font-weight: 600; }
    .nav-item .ni-ic { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-item .ni-ic img { width: 20px; height: 20px; object-fit: contain; display: block; }
    .nav-item .ni-caret { margin-left: auto; flex-shrink: 0; width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform 0.2s; transform-box: fill-box; transform-origin: center; }
    .nav-group.collapsed .ni-caret { transform: rotate(180deg); }
    .nav-sub { overflow: hidden; max-height: 300px; transition: max-height 0.25s ease; }
    .nav-group.collapsed .nav-sub { max-height: 0; }
    .nav-sub .nav-item { padding-left: 46px; font-weight: 450; }
    .wa-nav { transition: width 0.18s ease; }
    .wa-nav.collapsed { width: 60px; }
    .wa-nav.collapsed .nav-item { width: 44px; height: 40px; margin: 2px auto; padding: 0; justify-content: center; gap: 0; border-radius: 10px; }
    .wa-nav.collapsed .nav-item .ni-caret { display: none; }
    .wa-nav.txt-hide .nav-item { font-size: 0; }
    .wa-nav.txt-hide .ni-caret { display: none; }
    .wa-nav.txt-hide .nav-sub { display: none; }
    .wa-nav.collapsed .nav-sub { display: none; }
    .nav-foot { position: fixed; left: 92px; bottom: 24px; width: 240px; display: flex; justify-content: flex-end; padding: 0 8px; z-index: 80; transition: width 0.18s ease; }
    .wa-nav.collapsed .nav-foot { width: 60px; justify-content: center; padding: 0; }
    .nav-toggle { width: 30px; height: 30px; border: none; background: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }
    .nav-toggle:hover { background: var(--surface); }
    .nav-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .wa-nav.collapsed .nav-toggle svg { transform: scaleX(-1); }

    /* ══ CONTENT (WIREFRAME) ══ */
    .content { flex: 1; min-width: 0; }

    .w-label { height: 11px; width: 84px; background: var(--label); border-radius: 6px; }
    .w-label.sm { width: 60px; }
    .w-label.lg { width: 108px; }
    .w-fill { height: 16px; width: 100%; background: var(--fill); border-radius: 6px; }
    .w-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); flex-shrink: 0; }
    .w-pill { height: 20px; width: 88px; border-radius: 999px; background: var(--fill); }
    .w-btn { width: 74px; height: 32px; background: var(--fill); border-radius: 6px; flex-shrink: 0; }
    .w-kebab { width: 34px; height: 34px; border: 1px solid var(--fill); border-radius: 6px; flex-shrink: 0; justify-self: end; }

    /* toolbar */
    .wire-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .w-search { flex: 1; height: 38px; background: var(--card); border: 1px solid var(--card-border); border-radius: 6px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-shadow: 0 1px 3px rgba(20,40,55,0.05); }
    .w-search .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--fill); flex-shrink: 0; }
    .w-search .w-fill { width: 200px; height: 11px; background: var(--fill-soft); }
    .w-tbtn { height: 38px; width: 120px; background: var(--card); border: 1px solid var(--fill); border-radius: 6px; box-shadow: 0 1px 3px rgba(20,40,55,0.05); }

    /* table */
    .w-table { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; box-shadow: 0 1px 3px rgba(20,40,55,0.05); overflow: hidden; }
    .w-thead, .w-trow { display: grid; grid-template-columns: 2.4fr 1.6fr 1.9fr 1.6fr 64px; align-items: center; gap: 16px; padding: 12px 20px; }
    .w-thead { border-bottom: 1px solid var(--border); }
    .w-trow { border-bottom: 1px solid var(--border-light); padding: 10px 20px; }
    .w-trow:last-child { border-bottom: none; }
    .w-biz { display: flex; align-items: center; gap: 12px; }
    .w-biz .lines { display: flex; flex-direction: column; gap: 6px; }
    .w-biz .lines .w-fill { width: 120px; height: 12px; }
    .w-biz .lines .w-fill:last-child { width: 76px; height: 9px; background: var(--fill-soft); }
    .w-trow .w-fill.phone { width: 110px; height: 12px; }

    .table-foot-wire { margin-top: 12px; padding-left: 2px; }
    .table-foot-wire .w-fill { width: 220px; height: 10px; background: var(--fill-soft); }
  </style>
</head>
<body>

  <!-- ══ ICON RAIL ══ -->
  <div class="sys-sidebar">
    <div class="sys-logo"><img src="../shared/meta-logo.svg" alt="Meta" /></div>
    <div class="sys-biz"><svg viewBox="0 0 32 32"><path fill="#25D366" d="M16 2.7C8.6 2.7 2.7 8.6 2.7 16c0 2.4.6 4.6 1.8 6.6L2.7 29.3l6.9-1.8c1.9 1 4.1 1.6 6.4 1.6 7.4 0 13.3-5.9 13.3-13.3S23.4 2.7 16 2.7z"/></svg><span>B</span></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><path d="M3 6h16M3 11h16M3 16h16" stroke-linecap="round"/></svg></div>
    <div class="sys-spacer"></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><path d="M11 4v14M4 11h14" stroke-linecap="round"/></svg></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L19 19" stroke-linecap="round"/></svg></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="3"/><path d="M11 3v2M11 17v2M3 11h2M17 11h2M5 5l1.5 1.5M15.5 15.5L17 17M17 5l-1.5 1.5M6.5 15.5L5 17" stroke-linecap="round"/></svg></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8"/><path d="M9 8.5a2 2 0 113 1.7c-.7.4-1 .8-1 1.8M11 15.5v.01" stroke-linecap="round"/></svg></div>
  </div>

  <div class="wrap">
    <!-- ══ BREADCRUMB ══ -->
    <div class="topbar">
      <span>WhatsApp Manager</span>
      <span class="crumb-sep"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Partner overview</span>
    </div>

    <div class="body-row">
      <!-- ══ NAV ══ -->
      <nav class="wa-nav">
        <a class="nav-item active"><span class="ni-ic"><img src="../shared/wam-partneroverview-w.webp" alt=""></span>Partner overview</a>
        <a class="nav-item"><span class="ni-ic"><img src="../shared/wam-partnersolutions.webp" alt=""></span>Partner solutions</a>
        <a class="nav-item"><span class="ni-ic"><img src="../shared/wam-overview.webp" alt=""></span>Overview</a>

        <div class="nav-group collapsed" id="grp-templates">
          <div class="nav-item" onclick="toggleGrp('grp-templates')"><span class="ni-ic"><img src="../shared/wam-messagetemplates.webp" alt=""></span>Message templates<svg class="ni-caret" viewBox="0 0 16 16"><path d="M3 10.5l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="nav-sub">
            <a class="nav-item">Manage templates</a>
            <a class="nav-item">Template library</a>
          </div>
        </div>

        <a class="nav-item"><span class="ni-ic"><img src="../shared/wam-insights.webp" alt=""></span>Insights</a>

        <div class="nav-group collapsed" id="grp-account">
          <div class="nav-item" onclick="toggleGrp('grp-account')"><span class="ni-ic"><img src="../shared/wam-accounttools.webp" alt=""></span>Account tools<svg class="ni-caret" viewBox="0 0 16 16"><path d="M3 10.5l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="nav-sub">
            <a class="nav-item">Messaging limits</a>
            <a class="nav-item">Flows</a>
            <a class="nav-item">Phone numbers</a>
            <a class="nav-item">Catalog</a>
            <a class="nav-item">Activity log</a>
          </div>
        </div>

        <div class="nav-foot"><button class="nav-toggle" onclick="toggleNav()" title="Collapse menu"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12" stroke-linecap="round"/><path d="M13.5 7.5L11 10l2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      </nav>

      <!-- ══ CONTENT (wireframe) ══ -->
      <div class="content">

        <!-- toolbar -->
        <div class="wire-toolbar">
          <div class="w-search"><div class="dot"></div><div class="w-fill"></div></div>
          <div class="w-tbtn"></div>
          <div class="w-tbtn" style="width:100px;"></div>
          <div class="w-tbtn" style="width:110px;"></div>
        </div>

        <!-- table -->
        <div class="w-table">
          <div class="w-thead">
            <div class="w-label lg"></div>
            <div class="w-label"></div>
            <div class="w-label lg"></div>
            <div class="w-label"></div>
            <div></div>
          </div>

          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill"></div></div>
            <div class="w-btn"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:104px;"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill" style="width:96px;"></div></div>
            <div class="w-btn" style="width:92px;"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:150px;"></div><div class="w-fill"></div></div></div>
            <div><div class="w-fill phone"></div><div class="w-fill" style="width:84px;height:9px;background:var(--fill-soft);margin-top:6px;"></div></div>
            <div><div class="w-pill" style="width:120px;background:var(--label);"></div></div>
            <div class="w-btn" style="width:92px;"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:116px;"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill"></div></div>
            <div class="w-btn"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:96px;"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill" style="width:96px;"></div></div>
            <div class="w-btn" style="width:92px;"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:132px;"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill"></div></div>
            <div class="w-btn"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:110px;"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill" style="width:104px;"></div></div>
            <div class="w-btn" style="width:92px;"></div>
            <div class="w-kebab"></div>
          </div>
          <div class="w-trow">
            <div class="w-biz"><div class="w-circle"></div><div class="lines"><div class="w-fill" style="width:124px;"></div><div class="w-fill"></div></div></div>
            <div class="w-fill phone"></div>
            <div><div class="w-pill"></div></div>
            <div class="w-btn"></div>
            <div class="w-kebab"></div>
          </div>
        </div>

        <div class="table-foot-wire"><div class="w-fill"></div></div>
      </div>
    </div>
  </div>

  <script>
    function toggleGrp(id) { document.getElementById(id).classList.toggle('collapsed'); }
    function toggleNav() {
      var nav = document.querySelector('.wa-nav');
      if (nav.classList.contains('collapsed')) {
        nav.classList.remove('collapsed');
        setTimeout(function () { nav.classList.remove('txt-hide'); }, 180);
      } else {
        nav.classList.add('txt-hide');
        setTimeout(function () { nav.classList.add('collapsed'); }, 120);
      }
    }
    if (location.hash === '#embed') {
      var _embnav = document.querySelector('.wa-nav');
      if (_embnav) _embnav.classList.add('collapsed', 'txt-hide');
    }
  </script>
</body>
</html>
