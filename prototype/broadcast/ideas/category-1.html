<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Manager — Create template (all offers)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300..800&display=block" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @view-transition { navigation: auto; }

    :root {
      --bg: #FFFFFF; --page-bg: #F0F2F5; --surface: #F5F6F7;
      --ink: #1C2B33; --ink2: #465A69; --ink3: #6B7A85;
      --accent: #0A78BE; --accent-light: #E7F0FD; --link: #0A78BE;
      --border: #E4E6EB; --border-light: #ECEEF0; --green: #117D1A;
      --title: 'Commissioner', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body {
      min-height: 100%; font-family: var(--title);
      background: var(--page-bg); background-image: url('../shared/bg.jpg');
      background-size: cover; background-attachment: fixed; color: var(--ink);
      -webkit-font-smoothing: antialiased; font-size: 13px; line-height: 1.5; letter-spacing: 0.1px;
    }

    /* ══ LEFT SYSTEM ICON RAIL ══ */
    .sys-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 64px; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 16px 0 14px; gap: 6px; z-index: 90; }
    .sys-logo { margin-bottom: 8px; }
    .sys-logo img { width: 32px; height: 32px; object-fit: contain; display: block; }
    .sys-biz { position: relative; width: 36px; height: 36px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .sys-biz svg { width: 24px; height: 24px; display: block; }
    .sys-biz span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: translateY(-1px); color: #fff; font-weight: 600; font-size: 11px; }
    .sys-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink2); transition: background 0.12s; }
    .sys-icon:hover { background: var(--surface); }
    .sys-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .sys-spacer { flex: 1; }

    /* ══ SHELL ══ */
    .wrap { margin-left: 64px; padding: 22px 28px 80px; }
    .topbar { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 18px; padding-left: 4px; }
    .topbar .crumb-sep { display: inline-flex; align-items: center; }
    .topbar .crumb-sep svg { width: 20px; height: 20px; stroke: var(--ink2); fill: none; stroke-width: 1.8; }
    .body-row { display: flex; gap: 20px; align-items: flex-start; }

    /* ══ NAV ══ */
    .wa-nav { width: 240px; flex-shrink: 0; padding-top: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 6px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: none; user-select: none; transition: background 0.1s; white-space: nowrap; }
    .nav-item:hover { background: rgba(0,0,0,0.06); }
    .nav-item.active { background: #1C2B33; color: #fff; font-weight: 600; }
    .nav-item .ni-ic { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-item .ni-ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .nav-item .ni-ic img { width: 20px; height: 20px; object-fit: contain; display: block; }
    .nav-item .ni-caret { margin-left: auto; flex-shrink: 0; width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform 0.2s; transform-box: fill-box; transform-origin: center; }
    .nav-group.collapsed .ni-caret { transform: rotate(180deg); }
    .nav-sub { overflow: hidden; max-height: 300px; transition: max-height 0.25s ease; }
    .nav-group.collapsed .nav-sub { max-height: 0; }
    .nav-sub .nav-item { padding-left: 46px; font-weight: 450; }

    /* nav collapse */
    .wa-nav { transition: width 0.18s ease; }
    .wa-nav.collapsed { width: 60px; }
    .wa-nav.collapsed .nav-item { width: 44px; height: 40px; margin: 2px auto; padding: 0; justify-content: center; gap: 0; border-radius: 10px; }
    .wa-nav.collapsed .nav-item .ni-caret { display: none; }
    .wa-nav.txt-hide .nav-item { font-size: 0; }
    .wa-nav.txt-hide .ni-caret { display: none; }
    .wa-nav.txt-hide .nav-sub { display: none; }
    .wa-nav.collapsed .nav-sub { display: none; }
    .nav-foot { position: fixed; left: 92px; bottom: 24px; width: 240px; display: flex; justify-content: flex-end; padding: 0 8px; z-index: 80; transition: width 0.18s ease; }
    .wa-nav.collapsed .nav-foot { width: 60px; justify-content: center; padding: 0; }
    .nav-toggle { width: 30px; height: 30px; border: none; background: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }
    .nav-toggle:hover { background: var(--surface); }
    .nav-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .wa-nav.collapsed .nav-toggle svg { transform: scaleX(-1); }

    /* ══ CONTENT ══ */
    .content { flex: 1; min-width: 0; }

    .card { background: var(--bg); border: 1px solid var(--border-light); border-radius: 4px; padding: 12px 16px 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.03); }
    .card h3 { font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .card .card-sub { font-size: 13px; color: var(--ink); line-height: 1.5; margin-bottom: 4px; }
    .card .card-sub a { color: var(--link); text-decoration: none; }

    /* category sections */
    .cat-sec { margin-top: 18px; }
    .cat-h { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
    .cat-h svg { width: 16px; height: 16px; flex-shrink: 0; }
    .cat-d { font-size: 13px; color: var(--ink2); margin-top: 1px; }

    /* offer cards — 4 per row */
    .offer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 12px; }
    .offer-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: box-shadow 0.12s, border-color 0.12s; }
    .offer-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .offer-card.active { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
    .oc-img { height: 172px; background: linear-gradient(rgba(0,0,0,0.04), rgba(0,0,0,0.04)), #EFE7DE url('images/preview.jpg') center/cover; display: flex; align-items: center; justify-content: center; padding: 12px; }
    .oc-bubble { background: #fff; border-radius: 8px; padding: 7px 8px 4px; width: 100%; max-width: 156px; box-shadow: 0 1px 2px rgba(0,0,0,0.14); font-size: 10.5px; color: #111; }
    .oc-media { width: 100%; height: 52px; border-radius: 5px; object-fit: cover; display: block; margin-bottom: 6px; background: #d9d9d9; }
    .oc-catalog { display: flex; gap: 6px; align-items: center; background: #f0f2f5; border-radius: 5px; padding: 4px; margin-bottom: 6px; }
    .oc-cat-thumb { width: 34px; height: 34px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #d9d9d9; }
    .oc-cat-title { font-size: 9.5px; font-weight: 600; line-height: 1.25; }
    .oc-cat-sub { font-size: 8.5px; color: #667781; line-height: 1.25; }
    .oc-body { line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .oc-btn { margin: 5px -8px 0; border-top: 1px solid #eef0f1; color: #008069; text-align: center; font-weight: 500; font-size: 10px; padding: 4px 0; }
    .oc-name { padding: 10px 12px; display: flex; align-items: center; gap: 9px; }
    .oc-radio { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #B9C0C7; background: #fff; flex-shrink: 0; position: relative; }
    .offer-card.active .oc-radio { border-color: var(--accent); }
    .offer-card.active .oc-radio::after { content: ''; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--accent); }
    .oc-name span { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* footer action bar */
    .footbar { position: fixed; left: 352px; right: 24px; bottom: 20px; background: var(--bg); border: 1px solid var(--border-light); border-radius: 4px; padding: 14px 20px; display: flex; justify-content: space-between; box-shadow: 0 4px 16px rgba(0,0,0,0.08); z-index: 80; transition: left 0.18s ease; }
    .wa-nav.collapsed ~ .content .footbar { left: 172px; }
    .btn-primary { font-family: var(--title); font-size: 14px; font-weight: 500; color: #fff; background: var(--accent); border: none; border-radius: 4px; padding: 6px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-primary:hover { background: #096AAA; }
    .btn-secondary { font-family: var(--title); font-size: 14px; font-weight: 500; color: var(--ink); background: var(--bg); border: 1px solid #d1d5db; border-radius: 4px; padding: 6px 16px; cursor: pointer; text-decoration: none; }
    .btn-secondary:hover { background: var(--surface); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ══ ICON RAIL ══ -->
  <div class="sys-sidebar">
    <div class="sys-logo"><img src="../shared/meta-logo.svg" alt="Meta" /></div>
    <div class="sys-biz"><svg viewBox="0 0 32 32"><path fill="#25D366" d="M16 2.7C8.6 2.7 2.7 8.6 2.7 16c0 2.4.6 4.6 1.8 6.6L2.7 29.3l6.9-1.8c1.9 1 4.1 1.6 6.4 1.6 7.4 0 13.3-5.9 13.3-13.3S23.4 2.7 16 2.7z"/></svg><span>B</span></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><path d="M3 6h16M3 11h16M3 16h16" stroke-linecap="round"/></svg></div>
    <div class="sys-spacer"></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><path d="M11 4v14M4 11h14" stroke-linecap="round"/></svg></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L19 19" stroke-linecap="round"/></svg></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="3"/><path d="M11 3v2M11 17v2M3 11h2M17 11h2M5 5l1.5 1.5M15.5 15.5L17 17M17 5l-1.5 1.5M6.5 15.5L5 17" stroke-linecap="round"/></svg></div>
    <div class="sys-icon"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8"/><path d="M9 8.5a2 2 0 113 1.7c-.7.4-1 .8-1 1.8M11 15.5v.01" stroke-linecap="round"/></svg></div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <span>WhatsApp Manager</span>
      <span class="crumb-sep"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Create template</span>
    </div>

    <div class="body-row">
      <!-- ══ NAV ══ -->
      <nav class="wa-nav">
        <a class="nav-item"><span class="ni-ic"><img src="../shared/wam-overview.webp" alt=""></span>Overview</a>

        <div class="nav-group" id="grp-templates">
          <div class="nav-item" onclick="toggleGrp('grp-templates')"><span class="ni-ic"><img src="../shared/wam-messagetemplates.webp" alt=""></span>Message templates<svg class="ni-caret" viewBox="0 0 16 16"><path d="M3 10.5l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="nav-sub">
            <a class="nav-item active" href="template-list.html">Manage templates</a>
            <a class="nav-item">Template library</a>
          </div>
        </div>

        <a class="nav-item"><span class="ni-ic"><img src="../shared/wam-insights.webp" alt=""></span>Insights</a>

        <div class="nav-group collapsed" id="grp-account">
          <div class="nav-item" onclick="toggleGrp('grp-account')"><span class="ni-ic"><img src="../shared/wam-accounttools.webp" alt=""></span>Account tools<svg class="ni-caret" viewBox="0 0 16 16"><path d="M3 10.5l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="nav-sub">
            <a class="nav-item">Messaging limits</a>
            <a class="nav-item">Flows</a>
            <a class="nav-item">Phone numbers</a>
            <a class="nav-item">Catalog</a>
            <a class="nav-item">Activity log</a>
          </div>
        </div>

        <div class="nav-foot"><button class="nav-toggle" onclick="toggleNav()" title="Collapse menu"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12" stroke-linecap="round"/><path d="M13.5 7.5L11 10l2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      </nav>

      <!-- ══ CONTENT ══ -->
      <div class="content">
        <div class="card">
          <h3>Set up your template</h3>
          <p class="card-sub">Select the type of message you want to send. <a href="#">Learn more about categories.</a></p>
          <div id="catSections"></div>
        </div>

        <!-- ══ FOOTER ACTION BAR ══ -->
        <div class="footbar">
          <a class="btn-secondary" href="template-list.html">Discard</a>
          <a class="btn-primary" id="nextBtn" href="configuration.html">Next</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleGrp(id) { document.getElementById(id).classList.toggle('collapsed'); }
    function toggleNav() {
      var nav = document.querySelector('.wa-nav');
      if (nav.classList.contains('collapsed')) {
        nav.classList.remove('collapsed');
        setTimeout(function () { nav.classList.remove('txt-hide'); }, 180);
      } else {
        nav.classList.add('txt-hide');
        setTimeout(function () { nav.classList.add('collapsed'); }, 120);
      }
    }

    if (location.hash === '#embed') {
      var _embnav = document.querySelector('.wa-nav');
      if (_embnav) _embnav.classList.add('collapsed', 'txt-hide');
    }

    var IC_MEGA = '<svg viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M4.7 15.762h.776c.633 0 1.143-.51 1.143-1.143v-2.4H3.114c.267.815.42 1.638.45 2.446a1.135 1.135 0 0 0 1.135 1.097zM2.429 10.314h5.44s.045.038.068.053a15.303 15.303 0 0 0 2.735 1.372c1.014.388 2.073.678 3.193.86v.008c-.053.42.236.8.655.854h.1c.373 0 .7-.282.753-.663a43.68 43.68 0 0 0 0-11.627.762.762 0 0 0-.853-.655.762.762 0 0 0-.655.853v.008c-1.12.183-2.187.472-3.193.861-.952.366-1.859.815-2.735 1.371-.023.016-.045.03-.068.054h-5.44A1.905 1.905 0 0 0 .524 5.568v2.819c0 1.051.853 1.904 1.905 1.904v.023z"/></svg>';
    var IC_BELL = '<svg viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M10.824 13.684a2.775 2.775 0 0 1-2.682 2.078 2.771 2.771 0 0 1-2.682-2.078c.815.085 1.71.138 2.683.138.971 0 1.867-.053 2.681-.138zM8.143.524a4.849 4.849 0 0 1 4.848 4.848v1.55c0 1.204.568 2.34 1.532 3.062.569.427.47 1.26-.21 1.468-1.282.389-3.383.846-6.17.846s-4.888-.457-6.17-.846c-.68-.207-.78-1.04-.21-1.468a3.83 3.83 0 0 0 1.531-3.063V5.372A4.848 4.848 0 0 1 8.143.524z"/></svg>';
    var IC_KEY = '<svg viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M6.726 6.457a4.339 4.339 0 0 0-4.168 1.13A4.343 4.343 0 1 0 9.83 9.56l.897-.897a.763.763 0 0 0 .184-.298l.385-1.158 1.159-.386a.763.763 0 0 0 .482-.482l.386-1.158 1.157-.386a.762.762 0 0 0 .521-.722V2.047a.763.763 0 0 0-.761-.762h-2.027a.762.762 0 0 0-.482.173l-.056.05-4.949 4.95zm-.084 3.188a1.433 1.433 0 1 1-2.025 2.026 1.433 1.433 0 0 1 2.025-2.026z"/></svg>';

    const DATA = {
      Marketing: {
        icon: IC_MEGA,
        desc: 'Promotions, offers, product announcements and more.',
        formats: [
          { t: 'Default', href: 'configuration.html',
            pv: { media: 'images/basket.jpg',
                  body: 'Hey there! Check out our fresh groceries now! Use code <b>HEALTH</b> to get additional 10% off.',
                  btns: ['Shop now'] } },
          { t: 'Catalog', href: 'config-catalog.html',
            pv: { catalog: { img: 'images/basket.jpg', title: "Jasper's Market Catalog", sub: 'Browse our offerings.' },
                  body: 'Discover our latest products and bestsellers in our catalog. #happyshopping!',
                  btns: ['View catalog'] } },
          { t: 'Flows', href: 'config-flow.html',
            pv: { media: 'images/flows.jpg',
                  body: 'Make dinner with Jasper Market! Our free online courses will be available soon!',
                  btns: ['Sign up'] } }
        ]
      },
      Utility: {
        icon: IC_BELL,
        desc: 'Messages about an existing order or account.',
        formats: [
          { t: 'Default', href: 'config-utility.html',
            pv: { body: 'Good news! Your order 23KFEJJ2312 has shipped! Here’s your tracking information.',
                  btns: ['Track shipment'] } },
          { t: 'Order update', href: 'config-utility.html',
            pv: { body: '<b>Order update</b>\nThanks for your order, Jamie! Order 23KFEJJ2312 is confirmed and being prepared.',
                  btns: ['View order'] } },
          { t: 'Payment update', href: 'config-utility.html',
            pv: { body: '<b>Payment update</b>\nWe’ve received your payment of $80.00 for order 23KFEJJ2312. Thank you!',
                  btns: ['View receipt'] } }
        ]
      },
      Authentication: {
        icon: IC_KEY,
        desc: 'Codes to verify a transaction or login.',
        formats: [
          { t: 'One-time Passcode', href: 'config-auth.html',
            pv: { body: '123456 is your verification code. For your security, do not share this code.',
                  btns: [] } }
        ]
      }
    };

    const state = { cat: 'Marketing', fmt: 'Default' };

    function ocPreview(pv) {
      var h = '<div class="oc-bubble">';
      if (pv.media) h += '<img class="oc-media" src="' + pv.media + '" alt="" />';
      if (pv.catalog) h += '<div class="oc-catalog"><img class="oc-cat-thumb" src="' + pv.catalog.img + '" alt="" /><div><div class="oc-cat-title">' + pv.catalog.title + '</div><div class="oc-cat-sub">' + pv.catalog.sub + '</div></div></div>';
      h += '<div class="oc-body">' + pv.body.replace(/\n/g, '<br>') + '</div>';
      (pv.btns || []).forEach(function (b) { h += '<div class="oc-btn">' + b + '</div>'; });
      h += '</div>';
      return h;
    }

    function render() {
      var html = '';
      Object.keys(DATA).forEach(function (cat) {
        var d = DATA[cat];
        html += '<div class="cat-sec"><div class="cat-h">' + d.icon + cat + '</div><div class="cat-d">' + d.desc + '</div><div class="offer-grid">';
        d.formats.forEach(function (f) {
          var active = (state.cat === cat && state.fmt === f.t);
          html += '<div class="offer-card' + (active ? ' active' : '') + '" onclick="pick(\'' + cat + '\',\'' + f.t + '\')">'
                + '<div class="oc-img">' + ocPreview(f.pv) + '</div>'
                + '<div class="oc-name"><span class="oc-radio"></span><span>' + f.t + '</span></div>'
                + '</div>';
        });
        html += '</div></div>';
      });
      document.getElementById('catSections').innerHTML = html;
      var f = DATA[state.cat].formats.find(function (x) { return x.t === state.fmt; });
      document.getElementById('nextBtn').href = f ? f.href : 'configuration.html';
    }
    function pick(cat, fmt) { state.cat = cat; state.fmt = fmt; render(); }

    render();
  </script>
</body>
</html>
