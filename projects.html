<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="projects/favicons/mu.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mu Jiun Shie — Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.gstatic.com/s/commissioner/v24/tDbw2o2WnlgI0FNDgduEk4jAhwgumbU1SVfU5BD8OuRL8OstC6KOhgvBYWSFJ-Mgdrgiju6fF8m0akXaaRg2_g.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="https://fonts.gstatic.com/s/fraunces/v38/6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0KxC9TeP2Xz5c.woff2" as="font" type="font/woff2" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Commissioner:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/nav.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface2: #f2f2f3;
      --ink: #1d1d1f;
      --ink2: #6e6e73;
      --ink3: #767680;
      --accent: #1d1d1f;
      --accent-light: #f2f2f3;
      --border: #e8e8ea;
      --border2: #e8e8ea;
      --font: 'Commissioner', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --serif: 'Fraunces', Georgia, serif;
      --radius: 20px;
      --radius-pill: 999px;
    }

    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* header/nav/menu styles in css/nav.css */

    /* ── PAGE CONTENT ── */
    .page {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    .page-title {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 40px;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .page-sub {
      font-size: 15px;
      font-weight: 400;
      color: var(--ink3);
      margin-bottom: 36px;
    }

    /* ── PROJECT GRID ── */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      min-height: 300px;
    }

    @media (max-width: 1200px) {
      .project-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 880px) {
      .project-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 8px 40px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.25,.1,.25,1), box-shadow 0.3s cubic-bezier(.25,.1,.25,1);
      display: flex;
      flex-direction: column;
    }

    .project-card.coming-soon {
      cursor: default;
    }

    .card-img {
      width: 100%;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: var(--surface2);
    }

    .coming-soon-pill {
      position: absolute;
      bottom: 8px;
      left: 14px;
      font-size: 11px;
      font-weight: 500;
      color: #fff;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 999px;
      z-index: 1;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .project-card:hover:not(.coming-soon) .card-img img {
      transform: scale(1.04);
    }

    .card-body {
      padding: 12px 4px 2px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-company {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink3);
      margin-bottom: 4px;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: -0.0em;
      transition: color 0.18s ease;
    }

    .card-summary {
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      color: var(--ink2);
      line-height: 1.35;
      flex: 1;
    }



    /* ── PROJECT MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 24px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 1440px;
      height: 95vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.2);
      transform: translateY(12px) scale(0.98);
      transition: transform 0.25s ease;
    }

    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      color: var(--ink2);
      transition: all 0.15s ease;
    }

    .modal-close:hover {
      background: var(--ink);
      color: var(--bg);
    }

    .modal-body {
      flex: 1;
      min-height: 0;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .page { padding: 32px 16px 60px; }
      .project-grid { grid-template-columns: 1fr; }
      .modal-overlay { padding: 0; background: var(--bg); }
      .modal { border-radius: 0; height: 100vh; max-width: 100%; width: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <script src="js/nav.js"></script>



  <div class="page fade-page">
    <h1 class="page-title">Projects</h1>
    <div class="project-grid" id="projectGrid"></div>
  </div>

  <!-- PROJECT MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalClose"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" style="margin-top:-1px"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg></button>
      </div>
      <div class="modal-body">
        <iframe id="modalIframe" src="" title="Project"></iframe>
      </div>
    </div>
  </div>

  <script src="js/projects-data.js"></script>
  <script>
    // PROJECTS loaded from js/projects-data.js

    // ── RENDER GRID ──
    const grid = document.getElementById('projectGrid');

    function renderGrid() {
      grid.innerHTML = '';
      const list = PROJECTS;
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';
        if (p.comingSoon) {
          card.classList.add('coming-soon');
        } else {
          card.addEventListener('click', () => {
            if (p.external) {
              window.open(p.url, '_blank');
            } else {
              openModal(p.url, p.title, slugOf(p));
            }
          });
        }
        const pill = p.comingSoon ? '<span class="coming-soon-pill">Coming Soon</span>' : '';
        card.innerHTML = `
          <div class="card-img">
            ${pill}
            <img src="${p.img}" alt="${p.title}" loading="lazy" />
          </div>
          <div class="card-body">
            <div class="card-company">${p.company}</div>
            <div class="card-title">${p.title}</div>
            <div class="card-summary">${p.summary}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderGrid();

    // ── MODAL ──
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle   = document.getElementById('modalTitle');
    const modalIframe  = document.getElementById('modalIframe');
    const modalClose   = document.getElementById('modalClose');

    const slugOf = p => ((p.url || '').split('/').pop().replace('.html', '')) || String(p.title).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    function openModal(url, title, slug) {
      modalTitle.textContent = title;
      const sep = url.includes('?') ? '&' : '?';
      modalIframe.src = url + sep + 'embed=1';
      modalOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (slug) history.replaceState(null, '', '#' + slug);
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { modalIframe.src = ''; }, 250);
      history.replaceState(null, '', location.pathname + location.search);
    }

    // Deep link: open a project if the URL has a matching #slug on load
    (function openFromHash() {
      const slug = decodeURIComponent(location.hash.replace('#', '')).trim();
      if (!slug) return;
      const p = PROJECTS.find(pr => !pr.comingSoon && !pr.external && slugOf(pr) === slug);
      if (p) openModal(p.url, p.title, slug);
    })();

    // Hide side-nav inside iframe on mobile
    modalIframe.addEventListener('load', () => {
      try {
        const iframeDoc = modalIframe.contentDocument;
        if (iframeDoc && window.innerWidth <= 768) {
          const style = iframeDoc.createElement('style');
          style.textContent = '.side-nav { display: none !important; } .main-content { margin-left: 0 !important; width: 100% !important; max-width: 100% !important; padding: 0 16px !important; }';
          iframeDoc.head.appendChild(style);
        }
      } catch(e) {}
    });

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

  </script>
</body>
</html>
